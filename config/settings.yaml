# RuzzianProp Configuration

twitter:
  # Set via env vars: TWITTER_BEARER_TOKEN, TWITTER_API_KEY, etc.
  # Or provide directly here (not recommended for security)
  bearer_token: ""
  api_key: ""
  api_secret: ""
  access_token: ""
  access_secret: ""
  max_results_per_query: 100

bot_detection:
  # Weight of each signal in the final bot score (must sum to 1.0)
  # Disinformation/state-media signals carry higher weight because
  # human-operated state actors evade all automation-based signals.
  weights:
    account_age: 0.08
    username_pattern: 0.06
    profile_completeness: 0.06
    tweet_frequency: 0.08
    retweet_ratio: 0.08
    follower_ratio: 0.08
    content_similarity: 0.12
    posting_time_pattern: 0.07
    coordinated_behavior: 0.10
    disinformation_keywords: 0.13
    state_media_links: 0.14   # strongest single signal for state actors

  # Thresholds
  bot_threshold: 0.60        # Score >= this => likely bot
  suspected_threshold: 0.40  # Score >= this => suspected

disinformation:
  # Russian state-linked disinformation narrative keywords
  # Sources: EU DisinfoLab, DFRLab, Stanford Internet Observatory,
  #          IRA troll dataset, EU vs Disinfo database
  keywords:
    nato_narratives:
      - "NATO expansion"
      - "NATO aggression"
      - "NATO provocation"
      - "NATO threat"
      - "NATO lies"
      - "NATO war"
      - "provocations by NATO"
      - "NATO eastward"
    ukraine_war_kremlin_framing:
      - "special military operation"
      - "SMO"
      - "denazification"
      - "demilitarisation of Ukraine"
      - "Kiev regime"
      - "Kyiv regime"
      - "Zelensky nazi"
      - "Zelensky puppet"
      - "puppet regime in Kiev"
      - "Ukraine biolabs"
      - "Ukraine bioweapons"
      - "ukrainian nazis"
      - "azov battalion"
      - "Ukraine coup"
      - "Anglo-Saxons"
      - "collective West"
      - "Russia has the right"
      - "Nordstream was Ukraine"
      - "Nordstream sabotage by US"
    state_actor_amplification:
      - "RT reports"
      - "Sputnik reports"
      - "TASS reports"
      - "as RT said"
      - "according to RT"
      - "according to Sputnik"
    election_narratives:
      - "stolen election"
      - "election fraud"
      - "rigged election"
      - "deep state"
      - "globalist"
      - "great replacement"
      - "white genocide"
      - "replacement migration"
    western_narratives:
      - "western propaganda"
      - "mainstream media lies"
      - "fake news media"
      - "george soros"
      - "nwo globalist"
      - "globalist agenda"
      - "western hegemony"
      - "US hegemony"
      - "American imperialism"
      - "Anglo-Saxon imperialism"
    ira_hashtags:
      - "#NoWar"
      - "#IStandWithPutin"
      - "#RussiaUkraineWar"
      - "#NATOterrorists"
      - "#GlobohomoAgenda"
      - "#NAFO"
      - "#SlavaRossii"
      - "#ZWorld"
      - "#IStandWithRussia"

  # Known Russian state media domains
  state_media_domains:
    - rt.com
    - sputniknews.com
    - ria.ru
    - tass.ru
    - rbth.com
    - pravda.ru
    - vesti.ru

network:
  min_edge_weight: 2          # Minimum shared interactions to draw an edge
  community_resolution: 1.0   # Louvain community detection resolution
  max_nodes_display: 500      # Cap nodes in visualization for performance

visualization:
  output_dir: "./output"
  static_format: "png"        # png or svg
  interactive: true           # Generate interactive HTML network
  node_size_by: "bot_score"   # bot_score, followers, or degree
  color_scheme:
    confirmed_bot: "#e74c3c"
    suspected_bot: "#e67e22"
    human: "#2ecc71"
    unknown: "#95a5a6"
